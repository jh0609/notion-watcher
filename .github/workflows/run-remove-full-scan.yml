name: One-time remove full scan

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-remove-full-scan.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-automatic-full-scan
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Remove automatic full scan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('notion-watcher-once.js')
          text = main.read_text(encoding='utf-8')

          for fragment in [
              "const DEFAULT_DETAIL_FULL_SCAN_INTERVAL_MS = 24 * 60 * 60 * 1000;\n",
              "  const detailFullScanIntervalMs = parsePositiveIntegerEnv(env, 'DETAIL_FULL_SCAN_INTERVAL_MS', DEFAULT_DETAIL_FULL_SCAN_INTERVAL_MS);\n",
              "    detailFullScanIntervalMs,\n",
          ]:
              if fragment not in text:
                  raise SystemExit(f'missing expected fragment: {fragment!r}')
              text = text.replace(fragment, '', 1)

          text, count = re.subn(
              r"  const firstFullRun = !previousState;\n"
              r"  const lastFullScanAt = Date\.parse\(previousState\?\.lastFullDetailScanAt \|\| ''\);\n"
              r"  const fullScanDue = Boolean\(previousState\) && \(!Number\.isFinite\(lastFullScanAt\) \|\|\n"
              r"    now\.getTime\(\) - lastFullScanAt >= \(config\.detailFullScanIntervalMs \|\| DEFAULT_DETAIL_FULL_SCAN_INTERVAL_MS\)\);\n",
              '', text, count=1
          )
          if count != 1:
              raise SystemExit('missing full-scan plan block')

          old = "    if (fullScanDue) reason = 'periodic-full-scan';\n    else if (card.cardIncomplete) reason = 'card-parse-incomplete';"
          if old not in text:
              raise SystemExit('missing periodic-full-scan branch')
          text = text.replace(old, "    if (card.cardIncomplete) reason = 'card-parse-incomplete';", 1)

          old = "return { cards, detailUrls, detailReasonByUrl, previousMetadata, previousProducts, firstFullRun, fullScanDue };"
          if old not in text:
              raise SystemExit('missing hybrid plan return')
          text = text.replace(old, "return { cards, detailUrls, detailReasonByUrl, previousMetadata, previousProducts };", 1)

          text, count = re.subn(
              r"\n    catalog\.lastFullDetailScanAt = \(hybridPlan\.firstFullRun \|\| hybridPlan\.fullScanDue\)\n"
              r"      \? hybridNow\.toISOString\(\) : config\.previousState\?\.lastFullDetailScanAt \|\| null;",
              '', text, count=1
          )
          if count != 1:
              raise SystemExit('missing lastFullDetailScanAt persistence')

          forbidden = ['DEFAULT_DETAIL_FULL_SCAN_INTERVAL_MS', 'detailFullScanIntervalMs',
                       'periodic-full-scan', 'fullScanDue', 'firstFullRun']
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f'full-scan identifiers remain: {remaining}')
          main.write_text(text, encoding='utf-8')

          env_file = Path('.env.example')
          env_file.write_text(re.sub(r'^DETAIL_FULL_SCAN_INTERVAL_MS=.*\n?', '',
                                     env_file.read_text(encoding='utf-8'), flags=re.M), encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = re.sub(r'^DETAIL_FULL_SCAN_INTERVAL_MS=.*\n?', '', readme_text, flags=re.M)
          readme_text = readme_text.replace(
              '카드 파싱이 완전하고 노출 옵션이 6개 미만인 상품은 카드만 사용합니다. 옵션 6개 이상, 이전 숨김 옵션 이력, 분석 `UNKNOWN`, 카드 파싱 불완전 상품은 상세 조회하며 `DETAIL_FULL_SCAN_INTERVAL_MS`의 기본값인 24시간마다 전체 상세 검증합니다.',
              '카드 파싱이 완전하고 노출 옵션이 6개 미만인 상품은 카드만 사용합니다. 옵션 6개 이상, 이전 숨김 옵션 이력, 분석 `UNKNOWN`, 카드 파싱 불완전 상품만 상세 조회합니다. 자동 전체 상세 조회는 수행하지 않습니다.'
          )
          readme.write_text(readme_text, encoding='utf-8')

          test_file = Path('test/no-automatic-full-scan.test.js')
          test_file.parent.mkdir(parents=True, exist_ok=True)
          test_file.write_text("""'use strict';

const test = require('node:test');
const assert = require('node:assert/strict');
const { buildHybridDetailPlan } = require('../notion-watcher-once');

const notionPageUrl = 'https://example.notion.site/catalog-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
const productUrl = 'https://example.notion.site/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';

function safeDiscovery() {
  return {
    urls: [productUrl],
    candidates: [{
      innerText: '안전한 상품\\n10,000원\\n판매 중\\n옵션 A (판매 중)',
      hrefs: [productUrl],
      blockId: ''
    }]
  };
}

test('first run does not trigger an automatic full detail scan', () => {
  const plan = buildHybridDetailPlan(safeDiscovery(), null, new Date('2026-07-18T00:00:00Z'), {
    notionPageUrl,
    detailFullScanIntervalMs: 1
  });
  assert.deepEqual(plan.detailUrls, []);
  assert.equal('firstFullRun' in plan, false);
  assert.equal('fullScanDue' in plan, false);
});

test('old lastFullDetailScanAt is ignored', () => {
  const previousState = {
    lastFullDetailScanAt: '2000-01-01T00:00:00.000Z',
    productMetadata: {},
    catalog: { products: [] }
  };
  const plan = buildHybridDetailPlan(safeDiscovery(), previousState, new Date('2026-07-18T00:00:00Z'), {
    notionPageUrl,
    detailFullScanIntervalMs: 1
  });
  assert.deepEqual(plan.detailUrls, []);
});
""", encoding='utf-8')

          branch_workflow = Path('.github/workflows/remove-full-scan.yml')
          if branch_workflow.exists():
              branch_workflow.unlink()
          PY

      - name: Verify and test
        run: |
          ! grep -R "DETAIL_FULL_SCAN_INTERVAL_MS\|periodic-full-scan\|fullScanDue\|firstFullRun" \
            notion-watcher-once.js .env.example README.md
          npm run check
          npm test

      - name: Commit feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove automatic full detail scans"
          git push origin HEAD:fix/remove-automatic-full-scan

      - name: Remove one-time runner from main
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/run-remove-full-scan.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time remote maintenance runner"
            git push origin main
          fi
