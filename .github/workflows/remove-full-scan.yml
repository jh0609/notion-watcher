name: Remove automatic full detail scan

on:
  push:
    branches:
      - fix/remove-automatic-full-scan

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[full-scan-removed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-automatic-full-scan
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Remove automatic full-scan code and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('notion-watcher-once.js')
          text = main.read_text(encoding='utf-8')
          original = text

          replacements = [
              ("const DEFAULT_DETAIL_FULL_SCAN_INTERVAL_MS = 24 * 60 * 60 * 1000;\n", ""),
              ("  const detailFullScanIntervalMs = parsePositiveIntegerEnv(env, 'DETAIL_FULL_SCAN_INTERVAL_MS', DEFAULT_DETAIL_FULL_SCAN_INTERVAL_MS);\n", ""),
              ("    detailFullScanIntervalMs,\n", ""),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old!r}')
              text = text.replace(old, new, 1)

          old_plan = """  const firstFullRun = !previousState;
          const lastFullScanAt = Date.parse(previousState?.lastFullDetailScanAt || '');
          const fullScanDue = Boolean(previousState) && (!Number.isFinite(lastFullScanAt) ||
            now.getTime() - lastFullScanAt >= (config.detailFullScanIntervalMs || DEFAULT_DETAIL_FULL_SCAN_INTERVAL_MS));
          """
          if old_plan not in text:
              raise SystemExit('missing full-scan plan block')
          text = text.replace(old_plan, '', 1)

          old_reason = """    if (fullScanDue) reason = 'periodic-full-scan';
              else if (card.cardIncomplete) reason = 'card-parse-incomplete';
          """
          new_reason = """    if (card.cardIncomplete) reason = 'card-parse-incomplete';
          """
          if old_reason not in text:
              raise SystemExit('missing periodic-full-scan reason branch')
          text = text.replace(old_reason, new_reason, 1)

          old_return = "return { cards, detailUrls, detailReasonByUrl, previousMetadata, previousProducts, firstFullRun, fullScanDue };"
          new_return = "return { cards, detailUrls, detailReasonByUrl, previousMetadata, previousProducts };"
          if old_return not in text:
              raise SystemExit('missing hybrid plan return')
          text = text.replace(old_return, new_return, 1)

          scan_state = re.compile(
              r"\n    catalog\.lastFullDetailScanAt = \(hybridPlan\.firstFullRun \|\| hybridPlan\.fullScanDue\)\n"
              r"      \? hybridNow\.toISOString\(\) : config\.previousState\?\.lastFullDetailScanAt \|\| null;"
          )
          text, count = scan_state.subn('', text, count=1)
          if count != 1:
              raise SystemExit('missing lastFullDetailScanAt persistence block')

          if 'periodic-full-scan' in text or 'fullScanDue' in text or 'firstFullRun' in text:
              raise SystemExit('full-scan execution identifiers remain in main source')
          if text == original:
              raise SystemExit('main source was not changed')
          main.write_text(text, encoding='utf-8')

          env_file = Path('.env.example')
          env_text = env_file.read_text(encoding='utf-8')
          env_text = re.sub(r'^DETAIL_FULL_SCAN_INTERVAL_MS=.*\n?', '', env_text, flags=re.M)
          env_file.write_text(env_text, encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_text = re.sub(r'^DETAIL_FULL_SCAN_INTERVAL_MS=.*\n?', '', readme_text, flags=re.M)
          readme_text = readme_text.replace(
              '카드 파싱이 완전하고 노출 옵션이 6개 미만인 상품은 카드만 사용합니다. 옵션 6개 이상, 이전 숨김 옵션 이력, 분석 `UNKNOWN`, 카드 파싱 불완전 상품은 상세 조회하며 `DETAIL_FULL_SCAN_INTERVAL_MS`의 기본값인 24시간마다 전체 상세 검증합니다.',
              '카드 파싱이 완전하고 노출 옵션이 6개 미만인 상품은 카드만 사용합니다. 옵션 6개 이상, 이전 숨김 옵션 이력, 분석 `UNKNOWN`, 카드 파싱 불완전 상품만 상세 조회합니다. 자동 전체 상세 조회는 수행하지 않습니다.'
          )
          readme.write_text(readme_text, encoding='utf-8')

          test_file = Path('test/no-automatic-full-scan.test.js')
          test_file.parent.mkdir(parents=True, exist_ok=True)
          test_file.write_text(r"""'use strict';

const test = require('node:test');
const assert = require('node:assert/strict');
const { buildHybridDetailPlan } = require('../notion-watcher-once');

const notionPageUrl = 'https://example.notion.site/catalog-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
const productUrl = 'https://example.notion.site/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';

function safeDiscovery() {
  return {
    urls: [productUrl],
    candidates: [{
      innerText: '안전한 상품\n10,000원\n판매 중\n옵션 A (판매 중)',
      hrefs: [productUrl],
      blockId: ''
    }]
  };
}

test('first run does not trigger an automatic full detail scan', () => {
  const plan = buildHybridDetailPlan(safeDiscovery(), null, new Date('2026-07-18T00:00:00Z'), {
    notionPageUrl,
    detailFullScanIntervalMs: 1
  });

  assert.deepEqual(plan.detailUrls, []);
  assert.equal(Object.values(plan.detailReasonByUrl).includes('periodic-full-scan'), false);
  assert.equal('firstFullRun' in plan, false);
  assert.equal('fullScanDue' in plan, false);
});

test('old lastFullDetailScanAt is ignored and does not select every product', () => {
  const previousState = {
    lastFullDetailScanAt: '2000-01-01T00:00:00.000Z',
    productMetadata: {},
    catalog: { products: [] }
  };
  const plan = buildHybridDetailPlan(safeDiscovery(), previousState, new Date('2026-07-18T00:00:00Z'), {
    notionPageUrl,
    detailFullScanIntervalMs: 1
  });

  assert.deepEqual(plan.detailUrls, []);
  assert.equal(Object.values(plan.detailReasonByUrl).includes('periodic-full-scan'), false);
});
""", encoding='utf-8')

          workflow = Path('.github/workflows/remove-full-scan.yml')
          workflow.unlink()
          PY

      - name: Verify removed identifiers
        run: |
          ! grep -R "DETAIL_FULL_SCAN_INTERVAL_MS\|periodic-full-scan\|fullScanDue\|firstFullRun" \
            notion-watcher-once.js .env.example README.md

      - run: npm run check
      - run: npm test

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notion-watcher-once.js .env.example README.md test/no-automatic-full-scan.test.js .github/workflows/remove-full-scan.yml
          git commit -m "Remove automatic full detail scans [full-scan-removed]"
          git push origin HEAD:fix/remove-automatic-full-scan
